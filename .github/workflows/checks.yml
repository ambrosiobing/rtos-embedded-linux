name: checks

# Everything here needs nothing but a Python interpreter, so it runs on every
# push and on every pull request.
#
# The build and test jobs live in code.yml, which was added on Sunday 5 October
# 2026 when P01 brought the first code into this volume. Until then there was
# deliberately no such job, because a workflow that compiled nothing while being
# named "build" would imply a suite that did not exist. Nineteen of the twenty
# projects still have no code and their READMEs say so in their first line.
#
# What is checked is the published tree itself: that every chapter is there, that
# every figure a chapter names is beside the project it belongs to, that every
# link resolves, and that nothing which must stay private has reached it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The most important step in this file. Besides the house rules, dashes,
      # non-ASCII and violent idioms, this runs the name scan: the volume was
      # written with one advertisement open and prints no employer, product, town
      # or region. The scan stores each forbidden token as a hash, so the list is
      # enforced here without ever being spelled here. A failure means a name
      # reached the published tree.
      - name: House rules and the name scan, over every published file
        run: python scripts/lint.py

      - name: Every relative link resolves
        run: python scripts/check_links.py

      # A scripted edit passing through a shell heredoc loses one level of backslash, so
      # an intended newline escape inside a string literal can arrive as a real newline
      # and split the literal in two. It has happened twice. A compiler says so at once,
      # and the authoring laptop runs no compiler for this volume, so this is the gate
      # that does not depend on remembering to build before pushing.
      - name: No string literal is left open on its line
        run: python scripts/check_string_literals.py

      # Project 01 implements one table in three languages and every page in it says
      # the three agree row for row. This is that claim as a gate rather than a
      # sentence: it compares state, event, guard, action and destination for every
      # row IN ORDER, because order is load-bearing in this table, and it also checks
      # totality and that no unguarded row shadows a guarded one after it. Shown to
      # fail on four mutations before it was committed: a guard removed, two rows
      # swapped, a row deleted, and the C++ `guarded` bool disagreeing with its own
      # pointer.
      - name: The same table in C, C++ and Rust, row for row
        run: python scripts/crosscheck_table.py

      # P02's equivalent. Three implementations of one policy are three chances to write a
      # different policy, and no test in any of them can notice the drift, because each is
      # right about itself. This reads the three sources and compares the ordered list of
      # guard names and codes, which is why claim.c names its predicates rather than
      # writing the conditions inline.
      - name: The same cascade in C, C++ and Rust, arm for arm
        run: python scripts/crosscheck_cascade.py

      # P04's host half, which needs no board. Criterion 6 asks that a disagreement between the
      # two instruments be detectable, and it is the criterion that makes criterion 5 worth
      # anything: a reduction which cannot report a disagreement would pass the agreement
      # criterion by being blind. The suite is mostly refusals, and it was shown to go red on
      # six mutations before it was committed; the project README lists which case caught each.
      - name: P04's reduction refuses the captures that cannot mean anything
        run: |
          cd projects/04-what-the-kernel-primitives-cost/host
          python test_reduce.py

      # The loop between two descriptions of one format in two languages. adapter/measure.c
      # emits a capture and host/reduce.py parses one, each is right about itself, and neither
      # can notice a drift. P01 met that shape with one table in three languages and P02 with
      # one cascade in three. The core carries no kernel, vendor or processor header, which is
      # what lets it be built here at all. Built with the volume's own warning set rather than
      # a reduced one, because a core that only compiles cleanly under a cross compiler has a
      # host build that is not a check.
      - name: P04's emitter and its parser agree about the capture format
        run: |
          cd projects/04-what-the-kernel-primitives-cost/host
          make
          python test_capture_pipeline.py build/emit_capture

      # P04 criterion 7, and it is enforced rather than remembered because it is the rule most
      # likely to be broken quietly by somebody adding a row in a hurry. The acquisition board
      # resolves about ten microseconds; a context switch is far shorter; a row measuring one
      # with the other would publish a property of the instrument. Shown to reject seven bad
      # tables before it was committed, which the project README lists.
      - name: P04 claims no instrument that cannot see what the row claims
        run: python scripts/check_instruments.py

      # The structural check, and the one that proves the figures really are with
      # their projects rather than only referenced as if they were.
      - name: Twenty chapters, twenty projects, five figures each
        run: |
          set -e
          fail=0
          for n in $(seq -w 1 20); do
            count=$(ls -d chapters/${n}-*.md 2>/dev/null | wc -l)
            test "$count" = 1 || { echo "chapters/${n}-*.md matches $count files, want 1"; fail=1; }

            count=$(ls -d projects/${n}-*/ 2>/dev/null | wc -l)
            test "$count" = 1 || { echo "projects/${n}-*/ matches $count directories, want 1"; fail=1; }
            dir=$(ls -d projects/${n}-*/ 2>/dev/null | head -1)

            for f in arch wiring uml mem timing; do
              test -f "${dir}docs/figures/z${n}_${f}.svg" \
                || { echo "missing ${dir}docs/figures/z${n}_${f}.svg"; fail=1; }
            done
            test -f "${dir}README.md" || { echo "missing ${dir}README.md"; fail=1; }
          done
          test -f chapters/00-about-this-volume.md || { echo "missing chapter 00"; fail=1; }
          test -f chapters/21-appendix.md           || { echo "missing the appendix"; fail=1; }
          test -f docs/figures/front_stack.svg      || { echo "missing docs/figures/front_stack.svg"; fail=1; }
          exit $fail

      - name: No assembled volume and no PDF is published
        run: |
          set -e
          if git ls-files | grep -E '\.(pdf|html|aux|log|toc|out)$'; then
            echo "A PDF or an HTML file is committed, and neither is ever published."
            echo "What this repository offers is one Markdown chapter and one project"
            echo "at a time. There is deliberately no assembled volume to download."
            echo "The PDF and the HTML are for the author's own proofreading and stay"
            echo "on the authoring machine."
            exit 1
          fi
          echo "no PDF, no HTML, no assembled volume. Markdown chapters only, as intended"

      # No LaTeX at all, figure sources included. This repository carries
      # Markdown and the images that Markdown needs, and nothing else: one markup
      # language in the tree. The LaTeX that generates it, chapter sources,
      # preamble, figure sources and the book build scripts, stays on the
      # authoring machine.
      - name: No LaTeX is published
        run: |
          set -e
          stray=$(git ls-files '*.tex' || true)
          if [ -n "$stray" ]; then
            echo "LaTeX is committed, and none of it belongs here:"
            echo "$stray"
            echo
            echo "What is published is the Markdown that scripts/publish.py writes,"
            echo "with the figures as SVG. If a .tex is back, the blanket *.tex rule"
            echo "in .gitignore was probably relaxed, or a file was force-added."
            exit 1
          fi
          echo "no LaTeX committed, as intended"

      # The other half of the same rule. Markdown, SVG and the scripts that
      # produce them are what a clone is for; a reader should not be asked to
      # download anything.
      # Extended on Sunday 5 October 2026, when P01 brought the first code. The
      # purpose of this guard is unchanged and is not about source types: it keeps
      # out the PDF, the HTML and the LaTeX. Source files are what the repository
      # is for, so the allowlist names the ones the projects carry.
      #
      # EXTENDED AGAIN ON FRIDAY 9 OCTOBER 2026, TO ADMIT ONE BINARY TYPE, AND THIS
      # ONE IS A REAL RELAXATION RATHER THAN A CLARIFICATION. Read before adding more.
      #
      # The sentence above says a reader should not be asked to download anything,
      # and a GIF is a download. The clause after it says the purpose is to keep out
      # the PDF, the HTML and the LaTeX, which a GIF is not. The two halves of the
      # original comment disagree about this case, so it was decided rather than
      # deduced: P04's criterion 5 needs a wire between two boards, and no drawing
      # proves a wire is actually fitted. A dated moving picture of the bench does.
      # SVG can show what was intended; it cannot witness what was built.
      #
      # THE COST IS NOT SMALL AND IS STATED SO IT IS NOT REDISCOVERED. Before this,
      # the largest tracked file in the repository was 96 KB. The first GIF is 3.45
      # MB, which is thirty-six times that and permanent in every clone, because git
      # keeps it even if a later commit removes it. That is why the size guard below
      # was added in the same commit: admitting a type without a ceiling is how a
      # documentation repository becomes a download.
      - name: Only the file types this repository publishes
        run: |
          set -e
          odd=$(git ls-files | grep -vE '(\.(md|svg|gif|py|yml|cff|c|h|cpp|hpp|rs|toml|conf|overlay)$|^LICENSE$|^\.git(ignore|attributes)$|(^|/)Makefile$|(^|/)CMakeLists\.txt$)' || true)
          if [ -n "$odd" ]; then
            echo "Files of a type this repository does not publish:"
            echo "$odd"
            exit 1
          fi
          echo "Markdown, SVG, GIF, the scripts, the workflow, the licence and the citation, as intended"

      # THE CEILING THAT COMES WITH THE RELAXATION ABOVE, WRITTEN IN THE SAME COMMIT.
      #
      # A temporary or widening change needs its limit written at the moment it is
      # made, or nobody writes it later. Four megabytes admits the one GIF that
      # prompted this and refuses the careless one: a full-resolution capture of the
      # same six seconds is over fifty.
      #
      # If this ever fails on a file that genuinely belongs, the answer is almost
      # always to make the file smaller, not the number bigger. The GIF it was
      # written around came down from 5.47 MB by dropping to eight frames a second
      # and sixty-four colours, with no loss of anything a reader needs to see.
      - name: Nothing in the tree is larger than four megabytes
        run: |
          set -e
          big=$(git ls-files | while IFS= read -r f; do
            s=$(stat -c%s "$f")
            if [ "$s" -gt 4194304 ]; then printf '%s %s\n' "$s" "$f"; fi
          done)
          if [ -n "$big" ]; then
            echo "Files over four megabytes are committed, in bytes and path:"
            echo "$big"
            echo
            echo "Git keeps a blob even after a later commit removes it, so this"
            echo "is permanent in every clone. Make the file smaller."
            exit 1
          fi
          echo "nothing over four megabytes, as intended"

      - name: No journal and no correspondence is published
        run: |
          set -e
          if git ls-files | grep -iE '(^|/)(private_journal|correspondence)/|(^|/)DIARY[^/]*\.md$'; then
            echo "A journal or a correspondence file is committed."
            echo "These live in the catalogue, which is local only. A published"
            echo "repository carries the work, never the running record of doing it."
            exit 1
          fi
          echo "no journal, no correspondence, as intended"
