name: code

# The code half of this volume, which did not exist until P01 started.
#
# Why this is a separate workflow from checks.yml: that one reads the published
# Markdown and needs nothing but Python, so it stays fast and never goes red for a
# compiler's reasons. This one needs compilers, and it is allowed to be slower.
#
# **The point of the matrix is the point of the project.** The same two source
# files are compiled under three versions of the language, with no per-version
# source and no ifdefs, because the claim P01 makes is that the table is
# expressible without reaching for anything a later version added. A version that
# fails here is a finding about that claim, not a build problem to patch around.
#
# The warning set is -Werror with the usual pedantry, so a construct that a newer
# version merely deprecates fails rather than passing with a note nobody reads.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        std: [c11, c17, c23]
    name: C (${{ matrix.std }})
    steps:
      - uses: actions/checkout@v4

      - name: Which compiler this is
        run: gcc --version

      # -Wconversion is in the set on purpose. The table carries uint16 runs and
      # uint32 times, and an implicit narrowing between them is exactly the kind
      # of defect that passes every behavioural test and then truncates a hold on
      # a long-running node.
      - name: Compile and run the row-coverage test
        run: |
          set -e
          mkdir -p build-host
          # gcc 14 spells this standard -std=c23; gcc 13 only knows it as -std=c2x,
          # the pre-release name for the same document. The runner had gcc 13 on
          # the first run and refused c23 outright. Probe, use whichever this gcc
          # accepts, and say which, so the log records the compiler's vocabulary
          # rather than failing on it.
          STD=${{ matrix.std }}
          if [ "$STD" = c23 ] && ! gcc -std=c23 -fsyntax-only -x c /dev/null 2>/dev/null; then
            echo "this gcc has no -std=c23; using -std=c2x, the same standard under its pre-release name"
            STD=c2x
          fi
          echo "CSTD=$STD" >> "$GITHUB_ENV"
          echo "compiler: $(gcc --version | head -1), standard flag: -std=$STD"
          gcc -std=$STD -O2 \
              -Wall -Wextra -Werror -Wpedantic -Wshadow -Wconversion \
              -Wstrict-prototypes -Wmissing-prototypes \
              -o build-host/test_presence_${{ matrix.std }} \
              projects/01-presence/c/presence.c \
              projects/01-presence/c/test_presence.c
          ./build-host/test_presence_${{ matrix.std }}

      # A sanitised run of the same test. The dispatcher indexes a table by a
      # row number it computed itself, and an off-by-one there would read past
      # the end; -O2 alone will not say so.
      - name: The same test under the address and undefined-behaviour sanitisers
        run: |
          set -e
          gcc -std=$CSTD -O1 -g \
              -fsanitize=address,undefined -fno-omit-frame-pointer \
              -Wall -Wextra -Werror \
              -o build-host/test_presence_san_${{ matrix.std }} \
              projects/01-presence/c/presence.c \
              projects/01-presence/c/test_presence.c
          ./build-host/test_presence_san_${{ matrix.std }}

  # The C++ side, three versions, two compilers. presence.hpp is the C++17 baseline
  # and must compile unchanged under all three; presence23.hpp and presence26.hpp
  # add only what their version offers, behind feature-test macros. The test's
  # last lines are a report of which additions this compiler actually provided,
  # and docs/LANGUAGE_IDIOMS.md is filled from that report rather than from a
  # standards table. So read the log, not only the badge.
  cpp:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        std: [c++17, c++23, c++2c]
        cxx: [g++, clang++]
    name: C++ ${{ matrix.std }} via ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - run: ${{ matrix.cxx }} --version
      - name: Compile and run the row-coverage test, and print the feature report
        run: |
          set -e
          mkdir -p build-host
          # The first run found that gcc 13 has no C++26 mode at all: neither
          # -std=c++2c nor -std=c++26 is accepted. There is nothing to translate
          # the flag to, so when that happens the C++26 probes are measured under
          # the highest mode this compiler has, c++23, and every one of them will
          # report NOT available. That result is the finding, and the log says so
          # in words so that a green badge cannot be mistaken for C++26 support.
          STD=${{ matrix.std }}
          if [ "$STD" = c++2c ] && ! ${{ matrix.cxx }} -std=c++2c -fsyntax-only -x c++ /dev/null 2>/dev/null; then
            if ${{ matrix.cxx }} -std=c++26 -fsyntax-only -x c++ /dev/null 2>/dev/null; then
              STD=c++26
            else
              echo "this compiler has NO C++26 mode; the C++26 probes are measured under -std=c++23 and will all report NOT available"
              STD=c++23
            fi
          fi
          echo "CXXSTD=$STD" >> "$GITHUB_ENV"
          echo "compiler: $(${{ matrix.cxx }} --version | head -1), standard flag: -std=$STD"
          ${{ matrix.cxx }} -std=$STD -O2 \
              -Wall -Wextra -Werror -Wpedantic -Wshadow -Wconversion \
              -fno-exceptions -fno-rtti \
              -o build-host/test_presence_cpp \
              projects/01-presence/cpp/test_presence.cpp
          ./build-host/test_presence_cpp

      # -fno-exceptions above is the kernel adapter's reality. std::expected and
      # std::variant are both fine without exceptions as used here; this step
      # proves that nothing in the three headers quietly needs them.
      - name: The same under the sanitisers
        run: |
          set -e
          ${{ matrix.cxx }} -std=$CXXSTD -O1 -g \
              -fsanitize=address,undefined -fno-omit-frame-pointer \
              -Wall -Wextra -Werror -fno-exceptions -fno-rtti \
              -o build-host/test_presence_cpp_san \
              projects/01-presence/cpp/test_presence.cpp
          ./build-host/test_presence_cpp_san

  # Rust, three editions, one source. Unlike the C and C++ matrices this is not
  # three compilers' opinions: one toolchain builds every edition, and an edition
  # changes what the language permits rather than what the library offers. So the
  # pinned toolchain in rust-toolchain.toml is half the claim and its version is
  # printed below, because "compiles under three editions" says nothing about
  # which compiler did it.
  rust:
    runs-on: ubuntu-latest
    name: Rust, editions 2018, 2021 and 2024
    defaults:
      run:
        working-directory: projects/01-presence/rust
    steps:
      - uses: actions/checkout@v4

      - name: Which toolchain the pin resolves to
        run: |
          rustup show active-toolchain
          cargo --version
          rustc --version

      # Formatting and lints before the tests, because a warning here is a build
      # failure by the workspace's own lint setting and it is cheaper to see why
      # before a test log scrolls past it.
      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy, warnings denied, every target
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The real check. The same presence_core.rs and tests_core.rs compiled and
      # run three times, once per edition. An edition that needed its own source
      # would fail here rather than becoming a footnote.
      - name: The row-coverage tests, under each edition
        run: cargo test --workspace -- --nocapture

      # no_std is a claim about the node, and a host test proves nothing about it:
      # the test configuration pulls in std for the harness. This builds the
      # library alone for a bare-metal target, which is where the claim is either
      # true or a link error.
      - name: The library builds for a bare-metal target, which is what no_std means
        run: |
          rustup target add thumbv7em-none-eabihf
          cargo build --release --target thumbv7em-none-eabihf \
            -p presence-e2018 -p presence-e2021 -p presence-e2024

  # The same source through a second compiler. Two toolchains disagreeing about a
  # table of function pointers would be a finding worth having, and a warning one
  # of them raises and the other does not is the commonest way a portable claim
  # turns out to be a gcc claim.
  clang:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        std: [c11, c17, c23]
    name: C via clang (${{ matrix.std }})
    steps:
      - uses: actions/checkout@v4
      - run: clang --version
      - name: Compile and run
        run: |
          set -e
          mkdir -p build-host
          clang -std=${{ matrix.std }} -O2 \
              -Wall -Wextra -Werror -Wpedantic -Wshadow -Wconversion \
              -Wstrict-prototypes -Wmissing-prototypes \
              -o build-host/test_presence_clang_${{ matrix.std }} \
              projects/01-presence/c/presence.c \
              projects/01-presence/c/test_presence.c
          ./build-host/test_presence_clang_${{ matrix.std }}

  # The table under a real kernel, which is a different claim from the ones above.
  # Those compile the table; this runs it with a real queue, a real dispatch task and
  # a real software timer, and asserts the row sequence is the one the direct-dispatch
  # test produces. Same rows, different plumbing.
  #
  # The kernel is cloned at a pinned tag rather than vendored, so this job also says
  # which version the claim was made against. The build itself checks that no
  # allocator is linked, which is what configSUPPORT_DYNAMIC_ALLOCATION 0 means, and
  # the run has four phases; the two worth having are a release produced by the timer
  # rather than by an injected event, and a queue deliberately overrun to prove a lost
  # event is counted rather than dropped in silence.
  freertos:
    runs-on: ubuntu-latest
    name: FreeRTOS, the adapter on a host
    defaults:
      run:
        working-directory: projects/01-presence/freertos
    steps:
      - uses: actions/checkout@v4

      - name: The kernel, at the tag this claim is made against
        run: make fetch

      - name: Build, and refuse a binary containing an allocator
        run: make

      - name: The four phases
        run: make run

  zephyr:
    runs-on: ubuntu-latest
    name: Zephyr, the same adapter test on native_sim
    steps:
      - uses: actions/checkout@v4

      # native_sim compiles with the host gcc and needs no Zephyr SDK, which is the
      # whole reason this job is affordable. The 32-bit multilib is for the board
      # itself: plain native_sim is a 32-bit target, and native_sim/native/64 would
      # be a different board string from the one the page documents.
      - name: Host packages, and no SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             cmake ninja-build gperf device-tree-compiler             python3-pip python3-venv gcc-multilib g++-multilib

      # A virtual environment rather than pip --user, because Ubuntu's system Python
      # is marked externally managed and refuses the latter outright. This also
      # mirrors the local loop, which activates ~/zephyrproject/.venv.
      - name: A virtual environment, on PATH for every step below
        run: |
          python3 -m venv ~/zephyr-venv
          ~/zephyr-venv/bin/pip install --upgrade pip west
          echo "$HOME/zephyr-venv/bin" >> "$GITHUB_PATH"

      # Keyed on the revision below, so a green run is repeatable and a red one is
      # about this repository rather than about upstream having moved overnight.
      - name: Restore the Zephyr tree if it has been fetched before
        id: tree
        uses: actions/cache@v4
        with:
          path: ~/zephyrproject
          key: zephyr-v4.5.0-rc1-narrow-depth1

      # Shallow, and every module rather than a hand-picked set: choosing which
      # modules native_sim pulls in would be a guess, and the cache makes the whole
      # tree cost one fetch.
      - name: The tree, at a tag, shallow
        if: steps.tree.outputs.cache-hit != 'true'
        run: |
          west init -m https://github.com/zephyrproject-rtos/zephyr             --mr v4.5.0-rc1 ~/zephyrproject
          cd ~/zephyrproject
          west update --narrow -o=--depth=1

      # Order matters and cost an hour once: zephyr-export runs CMake, which imports
      # Zephyr's own Python, so the packages have to be in place before it is called.
      - name: Zephyr's Python packages, then the CMake package registry
        run: |
          cd ~/zephyrproject
          west packages pip --install
          west zephyr-export

      - name: The version this run is against
        run: git -C ~/zephyrproject/zephyr describe --tags --always

      # No -DZEPHYR_TOOLCHAIN_VARIANT here on purpose. CMakeLists.txt sets it when
      # nothing else has, and this job is the check that the documented three-line
      # build is the build.
      - name: Build, from outside any west workspace
        run: |
          cmake -B build-zephyr -GNinja -DBOARD=native_sim             -S projects/01-presence/zephyr
          ninja -C build-zephyr

      - name: The same four phases FreeRTOS runs
        run: ./build-zephyr/zephyr/zephyr.exe | tee phases.log

      # The executable returns the failure count, but a simulation that never reached
      # the phases would also exit 0, so the printed line is the gate as well.
      - name: The run must have said so
        run: |
          grep -q "^PASSED: 0 failure(s)$" phases.log
