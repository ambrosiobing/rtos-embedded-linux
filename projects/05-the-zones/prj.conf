# projects/05-the-zones/prj.conf
#
# DELIBERATELY SHORT, and the shortness is the point rather than an omission. The driver for
# this family is enabled by the devicetree and not from here: its Kconfig reads
# `default y` with `depends on DT_HAS_ST_VL53L5CX_ENABLED`, so describing the part in the
# overlay is what turns the driver on. A line here naming the driver would be a second place
# the same decision is made, and P03 established that the bus is a description rather than a
# configuration line.
#
# The vendor library is selected by the driver too, through `select HAS_STLIB`, so this file
# does not name that either. What it cannot supply is the binary firmware image, which is not
# in the tree at all and is fetched with `west blobs fetch hal_st`; see ../docs/DESIGN.md.

CONFIG_SENSOR=y

# THE DRIVER'S OWN LOG IS THE DIAGNOSIS, which is why logging is on in a project that measures
# nothing. This part uploads a firmware image at initialisation and the interesting failures all
# happen there: a missing image, a wrong address, a part that does not answer. Without the log
# those arrive as one line saying the device is not ready, which names none of them.
#
# P04 turned logging off because a synchronous console write inside a measured interval is
# expensive and lands in the figure. Nothing here is measured, so the trade goes the other way.
CONFIG_LOG=y
CONFIG_SENSOR_LOG_LEVEL_DBG=y

# Sixty-four zones with several fields each is a large result, so the stack that holds one is
# not the default. The figure is revised once the result structure's size is known from a build
# rather than estimated here.
CONFIG_MAIN_STACK_SIZE=4096

CONFIG_ASSERT=y
