# projects/01-presence/zephyr/prj.conf
#
# The smallest configuration that runs the adapter and its four phases. Every line is
# here for a reason stated beside it, because a prj.conf that accumulates options
# nobody can account for is how a project stops knowing what it depends on.

# No allocator, which is the same claim the FreeRTOS adapter makes and reaches by a
# different route. There, configSUPPORT_DYNAMIC_ALLOCATION at 0 makes xQueueCreate
# fail to link. Here the queue, the thread stack and the timers are static by
# construction, so there is nothing to switch off; this line makes sure k_malloc has
# no pool behind it either.
CONFIG_HEAP_MEM_POOL_SIZE=0

# printf, to stdout under native_sim. The phases print, and their output is the
# result that CI reads.
#
# CONFIG_STDOUT_CONSOLE is deliberately NOT here. The first build set it and Kconfig
# refused: it depends on not having NATIVE_LIBRARY with EXTERNAL_LIBC, which is
# exactly what native_sim is, because the simulation uses the host's own libc and its
# stdout directly. Setting it produced a warning and changed nothing, and an option
# that is overridden is worse than an absent one, because a reader believes it.
CONFIG_PRINTK=y

# No floating point in any format string here, so the smaller formatter is enough.
CONFIG_CBPRINTF_FP_SUPPORT=n

# main runs the phases, which call into the adapter and sleep; 4 kB is comfortable and
# this is a host build where a stack costs nothing worth saving.
CONFIG_MAIN_STACK_SIZE=4096

# The dispatch thread is named so that a stack or thread report says which one it is.
CONFIG_THREAD_NAME=y

# A failed kernel assertion should stop the run and say where, rather than turning a
# misuse into a hang. A hang in CI is six minutes of nothing and then a timeout nobody
# can diagnose.
CONFIG_ASSERT=y
