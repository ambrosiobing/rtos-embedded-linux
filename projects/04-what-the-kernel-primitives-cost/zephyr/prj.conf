# projects/04-what-the-kernel-primitives-cost/zephyr/prj.conf

# k_poll is the whole point of the several-objects row, and it is not on by default.
CONFIG_POLL=y

# The measurement prints integers only. Floating point formatting would pull a soft-float
# formatter into an application whose subject is how long things take.
CONFIG_CBPRINTF_FP_SUPPORT=n

CONFIG_MAIN_STACK_SIZE=4096

# OFF, DELIBERATELY. Assertions are useful and they are also code that runs inside the brackets
# this application exists to measure. A table whose numbers include an assertion's cost is a
# table about this build rather than about the kernel.
CONFIG_ASSERT=n
