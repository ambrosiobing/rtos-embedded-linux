# projects/04-what-the-kernel-primitives-cost/zephyr/prj.conf

# k_poll is the whole point of the several-objects row, and it is not on by default.
CONFIG_POLL=y

# The marker pin for criterion 5, PB4 at CN7 pin 19, named in app.overlay and nowhere else. One
# toggle per period boundary, so the MCC 118 sees one edge per period in either direction. Added
# Friday 9 October 2026, the day the lead was found to be fitted with nothing driving it.
CONFIG_GPIO=y

# The measurement prints integers only. Floating point formatting would pull a soft-float
# formatter into an application whose subject is how long things take.
CONFIG_CBPRINTF_FP_SUPPORT=n

CONFIG_MAIN_STACK_SIZE=4096

# OFF, DELIBERATELY. Assertions are useful and they are also code that runs inside the brackets
# this application exists to measure. A table whose numbers include an assertion's cost is a
# table about this build rather than about the kernel.
CONFIG_ASSERT=n

# OFF, AND IT WAS ON BY ACCIDENT UNTIL FRIDAY 9 OCTOBER 2026.
#
# CONFIG_TIMESLICING defaults to y and CONFIG_TIMESLICE_SIZE defaults to 20 ms, so every figure
# this project published before today was taken with a 20 ms timeslice compiled in and enabled.
# That was not a decision. It was a default nobody read, in a project whose entire subject is
# what kernel primitives cost.
#
# It matters for two separate reasons and only the second changes a number.
#
# The scheduler carries slice bookkeeping in the path every bracket here contains, and Zephyr's
# own latency_measure suite sets CONFIG_TIMESLICING=n. Comparing against it with this on would
# compare two kernels configured differently, which is the error criterion 2 exists to avoid.
#
# And the yield case runs its partner at the measurer's own priority, which is exactly the
# arrangement timeslicing acts on. Sixty-four brackets of about 9 us is under 600 us in total,
# far short of a 20 ms slice, so no slice boundary fell inside any run and the published minima
# stand as measured. The code was in the path; the behaviour never fired.
CONFIG_TIMESLICING=n

# THE INSTRUMENT UPSTREAM USES, added Friday 9 October 2026 so that ours can be the same one.
#
# Criterion 2 failed by a factor of five to seven on two spans whose endpoints match the upstream
# suite's line for line, and the residuals agree with each other to 5.6 per cent across two
# different paths, which points outside the operation rather than inside it. k_cycle_get_32() is
# the only thing this project has ever held the stopwatch with, and it has never been compared
# against anything.
#
# This is also what Zephyr's own latency_measure sets, so with it the two sides differ in one
# fewer thing.
CONFIG_TIMING_FUNCTIONS=y

# OFF, TO MATCH UPSTREAM, AND THIS ONE IS NOT A TIDYING-UP. READ THE CAVEAT.
#
# The board's own defconfig sets CONFIG_ARM_MPU=y and CONFIG_HW_STACK_PROTECTION=y, explicitly,
# under the comment "Enable HW stack protection". Zephyr's latency_measure sets it back to n in
# its prj.conf, with a comment and an issue number. So both sides state what they want and they
# want opposite things, which is why this was never going to be found by reasoning about defaults.
#
# With an MPU and stack protection the kernel reprograms a guard region on every thread switch.
# That is a per-switch cost sitting in the path of every row in this table, and it has the shape
# of the residual criterion 2 is left with: proportional rather than constant, and present in
# both compared rows whose only common content is a context switch.
#
# THE CAVEAT, BECAUSE THE CHAPTER MUST NOT READ AS ADVICE. Turning a stack guard off is a real
# reduction in safety and it is done here to make one comparison like for like, not because it is
# a good idea in firmware anybody ships. Real firmware on this board will have it on, because the
# board's defconfig turns it on deliberately. **The figure a chapter should quote for ordinary use
# is the one with protection ON**, which is the run of Friday 9 October 2026 at 09:40, already
# recorded in BENCH.md.
#
# Which means this is not only a comparison fix. The difference between the two runs is **what
# hardware stack protection costs per context switch on this part**, and that is a question an
# engineer choosing between them actually has, answered for the first time in this volume.
#
# AND THEN IT WENT BACK ON, THE SAME EVENING, AND THIS IS WHY THE LINE BELOW IS A COMMENT.
#
# The comparison ran at 21:15 on Friday 9 October 2026, criterion 2 was met at 0.98 and 1.12, and
# the guard measured 178 counts per switch, 0.64 microseconds. That is the whole of what turning
# it off was for. Leaving it off afterwards would have done two things wrong at once: published
# a repository whose default build has a stack guard silently disabled, and made RESULTS.md
# quote figures that a reader building the tree could not reproduce, because the table carries
# the guard-on figures on purpose.
#
# A temporary change needs its removal written at the moment it is made. This project learned
# that on Tuesday 6 October 2026 from a jumper left in a wiring sheet that shorted a supply to a
# data line three runs later. The setting below is that jumper. To reproduce the criterion 2
# comparison, uncomment it, rebuild, and expect the 21:15 figures; the board's own defconfig
# supplies the y that applies otherwise.
#
# CONFIG_HW_STACK_PROTECTION=n
