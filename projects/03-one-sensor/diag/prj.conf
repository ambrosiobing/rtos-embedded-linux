# projects/03-one-sensor/diag/prj.conf
#
# NO SENSOR DRIVER, on purpose. If CONFIG_ADXL345 were set here, the driver's init would run
# before main and fail, and its failure is the thing being investigated rather than a thing to
# reproduce. Without it the devicetree node is still present, DT_BUS still resolves, and the
# scan talks to the controller with nothing else on the bus having touched it first.

CONFIG_I2C=y

CONFIG_CBPRINTF_FP_SUPPORT=n
CONFIG_MAIN_STACK_SIZE=4096
