# projects/03-one-sensor/prj.conf
#
# IDENTICAL FOR BOTH BUILDS, deliberately. A reader looking for the place where the bus is
# selected will not find it here either: the bus comes from the devicetree, and Zephyr turns
# on the controller driver because the overlay enabled a node that needs it. If this file had
# to name I2C or SPI, the claim would already be weaker.

CONFIG_SENSOR=y
CONFIG_ADXL345=y

# The reading is printed rather than logged, so the output is the measurement and not a
# framework's idea of one. Floating point is left off: sensor_value is two integers and
# printing it as two integers avoids pulling a soft-float formatter into a comparison that is
# supposed to be about the bus.
CONFIG_CBPRINTF_FP_SUPPORT=n

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ASSERT=y
